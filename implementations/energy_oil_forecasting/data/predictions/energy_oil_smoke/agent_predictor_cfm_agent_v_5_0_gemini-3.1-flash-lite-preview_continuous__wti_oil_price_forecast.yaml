        cleaned_summary: "In early June 2025, WTI crude oil prices experienced a notable\
          \ bullish trend, driven by a combination of geopolitical concerns and positive\
          \ economic sentiment.\n\n### Market Reaction: June 2\u20138, 2025\n*   **Price\
          \ Performance:** During the week of June 2\u20136, 2025, WTI crude oil prices\
          \ saw a significant rally, gaining approximately 6.2%. By Friday, June 6,\
          \ WTI had broken above key technical resistance at $63.30, settling at $64.60\
          \ per barrel.\n*   **Key Drivers:**\n    *   **Trade Optimism:** The rally\
          \ was largely fueled by optimism surrounding U.S.-China trade talks, which\
          \ boosted market risk appetite and expectations for stronger global fuel\
          \ demand.\n    *   **Geopolitical Tensions:** Reports regarding potential\
          \ Israeli strikes on Iranian nuclear sites stoked fears of supply disruptions\
          \ in the Middle East, adding a geopolitical risk premium to oil prices.\n\
          \    *   **Supply Policy:** Ongoing negotiations and market commentary regarding\
          \ OPEC+ supply policies also contributed to the upward pressure on prices\
          \ during this period.\n\nThis early June period was characterized as a \"\
          moderate bullish period\" by market analysts, marked by supply-tightening\
          \ signals and easing concerns regarding the unwinding of aggressive OPEC+\
          \ production cuts."
