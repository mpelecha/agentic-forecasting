        cleaned_summary: 'In early June 2025, the global oil market was characterized
          by a transition in supply dynamics and shifting refinery profitability.


          ### Oil Production and Supply

          *   **Global Supply Trends:** Global oil supply rose by 330,000 barrels
          per day (kb/d) in May 2025 to reach 105 million barrels per day (mb/d),
          a level 1.8 mb/d higher than the previous year.

          *   **OPEC+ and Non-OPEC+ Contributions:** Monthly supply gains were evenly
          split between OPEC+ and non-OPEC+ producers, as the OPEC+ alliance began
          unwinding some of its voluntary production cuts.

          *   **Production Outlook:** World oil supply was projected to rise by 1.8
          mb/d in 2025 to reach 104.9 mb/d, with non-OPEC+ producers expected to lead
          this growth.


          ### Refinery Activity and Supply Response

          *   **Refining Margins:** Refining margins in May 2025 reached their highest
          levels since the first quarter of 2024, driven by strong gasoline demand
          and relatively low stocks.

          *   **Early June Shift:** While refinery throughputs were forecast to rise
          throughout 2025, a rally in crude oil prices in early June 2025 began to
          squeeze refinery profitability as the "cracks" (profit margins) for gasoline,
          naphtha, and fuel oil weakened.

          *   **Capacity Constraints:** Global refinery activity had risen to 79.3
          mb/d in May 2025, supported by strong demand in non-OECD countries. However,
          the sector faced ongoing pressure from plant closures in the U.S. and Europe,
          which tightened fuel supply.


          ### Inventory Context

          *   **Global Stocks:** Global oil stocks rose for the third consecutive
          month in April 2025, increasing by 32.1 million barrels to 7,717 million
          barrels, primarily driven by inventory builds in non-OECD countries. Despite
          these builds, total inventories remained lower than the previous year.'
