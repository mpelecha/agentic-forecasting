        status: accepted
        cleaned_summary: "In early June 2025, the global oil market\u2014including\
          \ West Texas Intermediate (WTI)\u2014was characterized by a period of relative\
          \ stability and range-bound pricing as trade tensions between the United\
          \ States and China subsided following a tariff d\xE9tente.\n\nKey developments\
          \ regarding physical crude oil flows and market conditions during this period\
          \ included:\n\n*   **Market Sentiment:** Early June saw a moderate trend.\n\
          *   **Inventory Trends:** Global oil stocks rose for the third consecutive\
          \ month in April 2025, led by builds in non-OECD crude oil inventories."
        associated_source_ids:
