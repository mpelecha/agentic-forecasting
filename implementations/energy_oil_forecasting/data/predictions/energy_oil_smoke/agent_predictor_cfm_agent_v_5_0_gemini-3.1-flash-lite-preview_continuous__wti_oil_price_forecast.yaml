        cleaned_summary: 'As of early June 2025, global physical crude oil flows and
          maritime shipping were characterized by a focus on geopolitical stability
          and the management of critical maritime chokepoints.


          ### Market Context (Prior to June 9, 2025)

          *   **Geopolitical Sensitivity:** Leading up to June 2025, the oil market
          remained highly sensitive to developments in the Middle East. The Strait
          of Hormuz was recognized as a critical energy chokepoint, with approximately
          20% of global oil shipments passing through it.

          *   **Shipping and Infrastructure:** Maritime trade routes were under close
          observation due to their role in linking major Middle Eastern producers
          with global markets, particularly in Asia. The stability of these flows
          was a primary concern for stakeholders, as any disruption to these corridors
          threatened to increase shipping insurance costs, tighten vessel availability,
          and impact feedstock access for refiners.

          *   **Supply and Demand Dynamics:** Global oil supply was experiencing growth,
          with projections for 2025 indicating an increase of 1.8 million barrels
          per day (mb/d) to reach 104.9 mb/d. This growth was supported by non-OPEC+
          producers and the unwinding of voluntary OPEC+ production cuts.

          *   **Inventory Levels:** Global oil stocks had shown a trend of building,
          with inventories rising for three consecutive months leading into the summer
          of 2025.


          ### Key Operational Metrics

          *   **Chokepoint Reliance:** Data from the first half of 2025 (1H25) highlighted
          the continued importance of major transit points. For instance, the Strait
          of Hormuz saw daily transit volumes of approximately 20.9 million barrels
          per day (mb/d) during this period.

          *   **Maritime Trade Volume:** Total world maritime oil trade was estimated
          at approximately 79.8 mb/d for the first half of 2025.

          *   **Shipping Routes:** The Cape of Good Hope remained a significant alternative
          route, with transit volumes recorded at 9.1 mb/d in 1H25, reflecting the
          industry''s ongoing adaptation to regional security concerns.'
