        status: accepted
        cleaned_summary: 'As of early June 2025, the following updates regarding OPEC
          and US crude oil production and inventories were reported:


          ### OPEC Production Updates

          *   **Production Adjustments:** On May 31, 2025, eight OPEC+ countries (Saudi
          Arabia, Russia, Iraq, UAE, Kuwait, Kazakhstan, Algeria, and Oman) reaffirmed
          their commitment to market stability and announced a production adjustment
          of 411,000 barrels per day (bpd) for June 2025, relative to May 2025 levels.

          *   **Strategy:** This adjustment was part of a broader plan initiated in
          early March 2025 to gradually reverse voluntary output cuts (totaling 2.2
          million bpd) over an 18-month period, spanning from April 2025 to September
          2026. The group indicated that these monthly increments could be paused
          or reversed depending on evolving market conditions.


          ### US Crude Oil Inventory Updates

          *   **Inventory Trends:** Data from the U.S. Energy Information Administration
          (EIA) for the week ending May 23, 2025, showed a decrease in U.S. crude
          oil inventories by 2.795 million barrels, which contrasted with market expectations
          of a 0.6 million barrel increase.

          *   **Refined Products:** During that same week, gasoline stocks fell by
          2.441 million barrels, and distillate fuel stocks declined by 724,000 barrels.

          *   **Market Context:** Historically, U.S. crude oil inventories tend to
          peak in April or May and often experience a decrease between June and August
          as consumption for transportation fuels increases.'
