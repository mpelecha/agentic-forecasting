  metadata:
    rationale: 'As of 2025-06-02, WTI faces a bearish structural backdrop defined
      by the OPEC+ decision to increase supply and ongoing concerns regarding tepid
      global demand growth (notably in the US and China). The market is in a ''wait-and-see''
      mode. Three primary scenarios inform the forecast: 1. ''Oversupply Reasserts''
      (Prob 0.6, Price ~55): Demand remains weak, and rising OPEC+/non-OPEC supply
      builds inventories, leading to a drift lower. 2. ''Range-bound Stability'' (Prob
      0.3, Price ~62): Macro headwinds and supply increases are balanced by potential
      SPR refills and geopolitical anxiety. 3. ''Regional Escalation'' (Prob 0.1,
      Tail Risk, Price ~75+): A sharp, unexpected geopolitical shock in the Persian
      Gulf disrupts shipping, overriding bearish fundamentals. The final quantiles
      are structured to reflect this range of outcomes, with the wider distribution
      at the 21-day horizon accounting for both the downside risks of oversupply and
      the upside tail risk of geopolitical disruption.'
    horizon_rationale: Short-term consolidation phase. The market is digesting the
      OPEC+ decision to increase supply and balancing it against persistent geopolitical
      premiums. Volatility remains moderate as the market tests support near $60.
