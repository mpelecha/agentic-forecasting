    rationale: The forecast is predicated on the transition from a 'triple shock'
      geopolitical crisis characterized by the Strait of Hormuz closure and extreme
      inventory draws toward a period of potential diplomatic de-escalation in late
      May 2026. The key variables are the durability of the reported U.S.-Iran memorandum,
      the exhaustion of the Strategic Petroleum Reserve (SPR) as a price-capping tool,
      and the structural supply limitations faced by OPEC+. Downside potential is
      supported by diplomatic progress; upside potential is driven by the physical
      reality of low inventories and the fragility of the regional security situation.
    horizon_rationale: By the 21-day horizon, the market structure should have better
      clarity on the mid-term supply situation. While OPEC+ continues its managed
      production adjustments, the exhaustion of the SPR (which hit 357 million barrels)
      and low global stocks leave the market vulnerable. A baseline forecast assumes
      a gradual de-escalation of the conflict, leading to further normalization, but
      the wide range of potential outcomes reflects the extreme sensitivity to Middle
      Eastern geopolitical stability.
