        cleaned_summary: "In January 2026, WTI crude oil prices experienced upward\
          \ pressure, climbing approximately 4.1% by the end of the month. This market\
          \ reaction was driven by several key factors:\n\n*   **Supply Disruptions:**\
          \ Winter Storm Fern caused significant disruptions, shutting in roughly\
          \ 15% of U.S. crude production and temporarily halting exports along the\
          \ Gulf Coast.\n*   **Geopolitical Tensions:** Escalating tensions between\
          \ the U.S. and Iran, characterized by a heightened military presence and\
          \ threats regarding the Strait of Hormuz, increased the geopolitical risk\
          \ premium.\n*   **Inventory Declines:** A reported decline in U.S. commercial\
          \ crude oil inventories further supported the view of a tightening market.\n\
          \nBy the end of January 2026, these combined factors\u2014tightening supply,\
          \ geopolitical concerns, and inventory draws\u2014had pushed WTI prices\
          \ to a high for the month."
