        cleaned_summary: 'As of the U.S. Energy Information Administration''s (EIA)
          **January 2026 Short-Term Energy Outlook (STEO)**, published on January
          22, 2026, the outlook for U.S. crude oil production was as follows:


          *   **Production Forecast:** The EIA projected that U.S. crude oil production
          would remain near the 2025 record of 13.6 million barrels per day (b/d)
          throughout 2026.

          *   **Trend:** The agency anticipated that production would plateau rather
          than continue the rapid growth seen in previous years. It forecasted a slight
          decrease of 2% to 13.3 million b/d in 2027, which would mark the first annual
          decline since 2021.

          *   **Drivers:** The forecast was heavily influenced by domestic crude oil
          prices. The EIA expected West Texas Intermediate (WTI) prices to fall from
          a 2025 average of $65/b to $52/b in 2026 and $50/b in 2027. This price environment
          was expected to reduce operators'' incentives to drill, with the slowdown
          in drilling activity projected to outpace gains in drilling productivity.

          *   **Regional Outlook:** Production in the Permian region was expected
          to remain essentially flat at 6.6 million b/d in 2026, while production
          in the Federal Gulf of America was forecast to rise slightly to 2.0 million
          b/d as new fields offset declines.'
