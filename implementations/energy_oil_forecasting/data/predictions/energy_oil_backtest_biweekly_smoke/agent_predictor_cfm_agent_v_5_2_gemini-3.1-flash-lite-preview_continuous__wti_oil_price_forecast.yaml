          \ by a significant upward trend, with prices experiencing a notable surge\
          \ during the first week of June 2025.\n\n### Market Context and Reaction\n\
          *   **Price Performance:** This marked a reversal in momentum, representing\
          \ the first weekly increase for the benchmark in three weeks.\n*   **Drivers\
          \ of the Rally:**\n    *   **Trade Optimism:** The surge was largely fueled\
          \ by optimism surrounding U.S.-China trade talks, which improved market\
          \ risk appetite and bolstered expectations for stronger global fuel demand.\n\
          \    *   **Geopolitical Tensions:** Concerns regarding potential Israeli\
          \ strikes on Iranian nuclear sites created fears of supply disruptions in\
