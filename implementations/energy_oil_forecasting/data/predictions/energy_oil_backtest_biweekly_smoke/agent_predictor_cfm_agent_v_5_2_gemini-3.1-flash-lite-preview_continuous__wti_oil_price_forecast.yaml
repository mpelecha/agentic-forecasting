        cleaned_summary: 'In early June 2025, OPEC+ continued its strategy of a gradual
          and flexible return of voluntary production adjustments.


          ### OPEC+ Production Policy

          *   **Production Adjustment:** Following a virtual meeting on May 31, 2025,
          eight OPEC+ countries (Saudi Arabia, Russia, Iraq, UAE, Kuwait, Kazakhstan,
          Algeria, and Oman) reaffirmed their commitment to market stability. They
          implemented a production adjustment of **411,000 barrels per day (bpd)**
          for June 2025, relative to the previous month''s required levels.

          *   **Strategy:** This move was part of a broader plan, agreed upon on December
          5, 2024, to gradually phase out 2.2 million bpd of voluntary production
          adjustments over an 18-month period that began on April 1, 2025. The group
          maintained that these increases could be paused or reversed depending on
          evolving market conditions.

          *   **Commitment:** The participating countries reiterated their commitment
          to full conformity with the Declaration of Cooperation and their intention
          to compensate for any overproduced volumes since January 2024.


          ### Oil Inventory and Market Context

          *   **Market Fundamentals:** In their late May/early June assessments, the
          participating OPEC+ countries cited "healthy market fundamentals," specifically
          noting **low oil inventories** as a justification for their production adjustments.

          *   **Market Trends:** Despite this, global oil demand growth for 2025 remained
          projected at approximately 1.3 million bpd, with significant contributions
          from non-OECD countries.'
