        cleaned_summary: "During late May and early June 2025, West Texas Intermediate\
          \ (WTI) crude oil prices experienced a period of range-bound trading.\n\n\
          ### WTI Price Trends\n*   **Late May 2025:** WTI spot prices remained in\
          \ a relatively narrow range. For the week of May 26\u201330, 2025, daily\
          \ spot prices were recorded at $61.61, $62.54, $61.66, and $61.46 per barrel.\
          \ The monthly average for May 2025 was approximately $62.20 per barrel.\n\
          *   **Early June 2025:** Prices showed signs of a slight recovery as the\
          \ month began.\n\n### Major Energy Market Context\nMarket observers characterized\
          \ May 2025 as a \"hinge point\" that potentially rewired global energy market\
          \ dynamics. Key factors influencing the market during this period included:\n\
          \n*   **Supply Strategy Adjustments:** Several major producing nations reportedly\
          \ recalibrated their output strategies. Notably, OPEC+ had previously decided\
          \ to increase output, with plans to unwind a portion of voluntary production\
          \ cuts through June 2025.\n*   **Geopolitical and Policy Shifts:** The energy\
          \ sector saw a confluence of geopolitical actions and policy announcements.\
          \ This included efforts by consuming nations to secure alternative supply\
          \ routes and storage capacities, alongside evolving regulatory frameworks\
          \ in major economies regarding fossil fuel investments and renewable energy.\n\
          *   **Demand Signals:** Global oil demand growth faced headwinds, with reports\
          \ of weak second-quarter deliveries in the United States and China. Additionally,\
          \ the rapid rise of AI and the associated surge in data center power demand\
          \ began to emerge as a significant driver of electricity and natural gas\
          \ consumption."
