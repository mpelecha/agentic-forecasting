        cleaned_summary: "The International Energy Agency (IEA) and OPEC released\
          \ their respective oil market reports for July 2026 prior to July 20, 2026.\n\
          \n### **International Energy Agency (IEA)**\nThe IEA\u2019s *Oil Market\
          \ Report* for July 2026 was published on **July 10, 2026**. Key insights\
          \ from this report included:\n*   **Demand Outlook:** A recovery in world\
          \ oil demand was noted, with consumption rising from a May nadir. The report\
          \ projected an overall decline in global oil demand of 1 million barrels\
          \ per day (mb/d) for 2026, with annual contractions easing from 4.8 mb/d\
          \ in the second quarter to 1.7 mb/d in the third quarter. Growth of 2 mb/d\
          \ was forecast for 2027.\n*   **Supply and Inventories:** Global oil supply\
          \ rebounded by 4.1 mb/d to 98.8 mb/d in June 2026, supported by a partial\
          \ recovery in Gulf production following a resumption of flows through the\
          \ Strait of Hormuz. Despite this, world output remained approximately 9.4\
          \ mb/d below pre-war levels. Global observed oil inventories rose by 21\
          \ million barrels in June, marking the first increase in four months.\n\n\
          ### **OPEC**\nThe OPEC *Monthly Oil Market Report* (MOMR) for July 2026\
          \ was also released in July 2026.\n*   **Demand Forecast:** In the July\
          \ 2026 MOMR, OPEC reduced its average annual forecast for world liquid fuel\
          \ demand by 400,000 barrels per day (kb/d) compared to its May 2026 assessment.\n\
          *   **Production and Market Conditions:** OPEC reported that OPEC-12 crude\
          \ oil output increased by 3,051 kb/d from May to June 2026, driven largely\
          \ by production increases in the UAE, Kuwait, Iraq, and Iran. Additionally,\
          \ on July 5, 2026, seven OPEC+ countries (Saudi Arabia, Russia, Iraq, Kuwait,\
          \ Kazakhstan, Algeria, and Oman) met and decided to implement a production\
          \ adjustment of 188,000 barrels per day starting in August 2026 as part\
          \ of their strategy to support market stability."
