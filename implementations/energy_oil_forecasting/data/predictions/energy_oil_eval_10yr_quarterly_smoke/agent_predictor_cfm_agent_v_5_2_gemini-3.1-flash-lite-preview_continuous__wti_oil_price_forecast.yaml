        ongoing Strait of Hormuz crisis. Despite a June production rebound, total
        global supply remains significantly depressed. Renewed hostilities in early
        July have reignited market risk premiums. OPEC+ supply adjustments for August
        are in place, while market sentiment remains divided on whether the Strait's
        status will result in price shocks or continued moderate volatility.
      overall_rationale: The WTI forecast is driven by the immediate geopolitical
