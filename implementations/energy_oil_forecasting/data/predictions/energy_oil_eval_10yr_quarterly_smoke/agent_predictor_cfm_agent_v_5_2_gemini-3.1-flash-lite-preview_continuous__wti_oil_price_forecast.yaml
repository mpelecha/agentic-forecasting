        cleaned_summary: "As of August 9, 2026, the underlying events driving WTI\
          \ crude oil prices were primarily centered on the persistent geopolitical\
          \ instability in the Middle East and its impact on global supply chains.\n\
          \n### Key Drivers of WTI Crude Oil Prices (Prior to August 10, 2026)\n\n\
          *   **Strait of Hormuz Disruptions:** The most significant factor influencing\
          \ oil markets throughout the summer of 2026 was the ongoing conflict and\
          \ resulting maritime security crisis in the Strait of Hormuz. Following\
          \ the expiration of a June memorandum of understanding between the U.S.\
          \ and Iran, hopes for a diplomatic breakthrough faded, leading to renewed\
          \ concerns over the safety of shipping lanes.\n*   **Supply Constraints:**\
          \ The U.S. Energy Information Administration (EIA) noted in its August 2026\
          \ outlook (completed August 6) that it had increased its estimates for shut-in\
          \ crude oil production in the Middle East. Severe constraints on transit\
          \ through the Strait of Hormuz significantly reduced global oil shipments,\
          \ keeping inventories tight.\n*   **Inventory Levels:** U.S. commercial\
          \ crude oil inventories were consistently trending below the five-year (2021\u2013\
          2025) low. High refinery runs and reduced imports, combined with the broader\
          \ supply-side disruptions, contributed to a persistent \"supply hole\" that\
          \ supported higher price levels.\n*   **Geopolitical Risk Premium:** Markets\
          \ were characterized by high volatility and an elevated risk premium. Traders\
          \ were closely monitoring the lack of progress in diplomatic negotiations\
          \ and the potential for further military or naval escalation, which kept\
          \ the market sensitive to any news regarding the status of the Strait of\
          \ Hormuz.\n\nThese factors collectively created a market environment where\
          \ supply-side fears\u2014driven by the physical inability to move oil through\
          \ critical chokepoints\u2014outweighed other macroeconomic considerations."
