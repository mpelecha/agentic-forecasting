        cleaned_summary: "As of July 20, 2026, the global oil market was characterized\
          \ by significant volatility and supply chain disruptions centered on the\
          \ Strait of Hormuz. Key developments leading up to this date included:\n\
          \n*   **Strait of Hormuz Disruptions:** The Strait, a critical maritime\
          \ chokepoint, remained a primary source of instability. Following a period\
          \ of partial recovery in June 2026\u2014when flows resumed under a memorandum\
          \ of understanding between the U.S. and Iran\u2014tensions persisted. By\
          \ early July, while some trade flows had begun to recover, the situation\
          \ remained fragile, with the International Energy Agency (IEA) noting that\
          \ the nascent recovery was contingent on a swift de-escalation of hostilities.\n\
          *   **Production Trends:** Global oil supply saw a sharp rebound in June\
          \ 2026, increasing by 4.1 million barrels per day (mb/d) to 98.8 mb/d as\
          \ flows through the Strait of Hormuz partially resumed. Despite this, total\
          \ world output remained approximately 9.4 mb/d below pre-war levels as of\
          \ the July 10, 2026, IEA report.\n*   **Inventory and Refining:** Global\
          \ observed oil inventories rose by 21 million barrels in June 2026, marking\
          \ the first increase in four months, as higher volumes of \"oil on water\"\
          \ offset continued draws in onshore storage. Refining margins reached four-year\
          \ highs in early July due to tight product markets, even as crude supplies\
          \ showed signs of increasing.\n*   **Market Outlook:** As of mid-July 2026,\
          \ the IEA projected that global oil supply would decline by an average of\
          \ 3.7 mb/d for the year, contingent on the continued de-escalation of the\
          \ conflict. The U.S. Energy Information Administration (EIA) also noted\
          \ in early July that it had increased its global oil production forecast\
          \ following the initial reopening of the Strait of Hormuz.\n\nThese developments\
          \ occurred against the backdrop of the ongoing 2026 Strait of Hormuz crisis,\
          \ which had significantly impacted global energy trade since February 2026."
