          crude inventories remained below the five-year low, and Strategic Petroleum
          Reserve (SPR) levels fell to their lowest points since the early 1980s,
          which supported prices by highlighting tight physical availability.


          ### Economic Context

          *   **Inflationary Pressures:** While global energy markets faced supply-side
          stress, some economic data reflected broader trends.

          *   **Demand Forecasts:** Prior to August 10, 2026, market expectations
          were shaped by forecasts of declining global oil demand for 2026, attributed
          in part to elevated fuel prices and the ongoing geopolitical conflict. Despite
          these demand concerns, the immediate market reaction in August was dominated
          by the supply-side risks and the "geopolitical risk premium" rather than
