        cleaned_summary: 'As of early August 2026, global oil production, shipping,
          and refinery logistics were heavily impacted by the ongoing closure of the
          Strait of Hormuz and broader geopolitical tensions in the Middle East.


          ### **Oil Production and Supply**

          *   **Production Status:** Global oil supply remained significantly constrained,
          with approximately 8.3 million barrels per day (mb/d) of Gulf output shut
          in. While global supply rose to 101.5 mb/d in July 2026, it remained 6.3
          mb/d below year-ago levels.

          *   **Forecasts:** Due to renewed hostilities and maritime disruptions in
          July and early August, the International Energy Agency (IEA) reduced its
          third-quarter 2026 supply projections by 1.7 mb/d. Global supply is projected
          to decline by an average of 4.3 mb/d for the full year of 2026.


          ### **Shipping and Logistics**

          *   **Strait of Hormuz:** The Strait remained a critical bottleneck, with
          tanker traffic severely impaired. Transit volumes through the Strait averaged
          4.9 mb/d in the second quarter of 2026, a sharp decline from 21.6 mb/d in
          the fourth quarter of 2025.

          *   **Rerouting and Chokepoints:** To mitigate the closure, producers have
          attempted to reroute flows, including increased usage of the East-West pipeline
          to the port of Yanbu on the Red Sea. Consequently, volumes through the Bab
          el-Mandeb strait increased to 8.1 mb/d in the second quarter of 2026.

          *   **Inventory Impacts:** Global observed oil inventories experienced a
          sharp decline, plunging by 69 million barrels in July 2026, driven by lower
          volumes of oil on water and export disruptions in the Gulf and Caspian Sea.


          ### **Refinery Logistics**

          *   **Throughput:** Refinery crude throughputs in July 2026 were 80.9 mb/d,
          nearly 5 mb/d below levels from the previous year.

          *   **Operational Challenges:** Refineries faced dual pressures from Middle
          East product export disruptions and attacks on Russian refineries, which
          led to a further reduction in third-quarter 2026 run estimates.

          *   **Market Conditions:** Tighter availability of light and middle distillates
          resulted in record-high crack spreads and refining margins in the Atlantic
          Basin.'
