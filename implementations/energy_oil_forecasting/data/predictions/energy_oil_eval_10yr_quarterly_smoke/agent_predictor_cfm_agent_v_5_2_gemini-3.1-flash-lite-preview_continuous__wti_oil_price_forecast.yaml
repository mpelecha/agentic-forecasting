        cleaned_summary: 'In July 2026, WTI crude oil futures (CL=F) experienced significant
          volatility driven primarily by geopolitical tensions in the Middle East
          and shifting expectations regarding supply disruptions.


          ### Market Context and Drivers

          *   **Geopolitical Tensions:** Throughout July, the market was heavily influenced
          by the ongoing conflict between the U.S. and Iran, specifically concerns
          regarding transit through the Strait of Hormuz. Rhetoric surrounding the
          conflict and potential supply constraints created a "geopolitical risk premium"
          that supported higher price levels.

          *   **Price Trends:** WTI crude oil futures trended consistently higher
          for much of July, rebounding from late-June lows to establish strong five-week
          highs by mid-month. Prices saw upward momentum as traders reacted to uncertainty
          heading into weekends.

          *   **Market Sentiment:** By late July, the market showed signs of easing
          as some geopolitical rhetoric cooled. Traders were actively assessing whether
          the price would sustain levels near $80 or if it would retreat toward lower
          forecasts, such as those suggested by the U.S. Energy Information Administration
          (EIA).


          ### Key Trading Observations

          *   **Volatility:** The month was characterized by range-bound risk, with
          market participants weighing the impact of EIA inventory data, OPEC+ production
          policies, and the potential for sudden price spikes due to regional hostilities.

          *   **Prediction Markets:** Prediction markets during this period reflected
          the uncertainty, with participants betting on whether the active month WTI
          contract would cross specific thresholds (such as $100 or below $65) before
          the end of the month.

          *   **Refinery Activity:** U.S. refinery activity provided some support
          to the market, with processing rates reaching high levels during the month,
          even as crude oil inventories saw fluctuations.'
