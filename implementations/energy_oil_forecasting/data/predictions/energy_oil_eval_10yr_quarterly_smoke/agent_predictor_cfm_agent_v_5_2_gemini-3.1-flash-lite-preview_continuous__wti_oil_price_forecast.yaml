        cleaned_summary: '### OPEC+ Production Policy

          On August 2, 2026, seven OPEC+ countries (Saudi Arabia, Russia, Iraq, Kuwait,
          Kazakhstan, Algeria, and Oman) met to review market conditions. They decided
          to implement a production adjustment of 188,000 barrels per day (bpd) starting
          in September 2026, noting that this measure would allow participating countries
          to accelerate their compensation for any overproduced volumes since January
          2024. This followed a July 5, 2026, decision by the same group to expand
          production by 188,000 bpd for the month of August.


          ### Global Oil Inventories and Demand

          *   **Inventory Levels:** Global observed oil inventories experienced a
          sharp decline in July 2026, falling by 69 million barrels as disruptions
          to exports from the Gulf and Caspian Sea regions reduced volumes of oil
          on water. Total observed inventories fell below 7.9 billion barrels.

          *   **Demand Forecasts:** OPEC and the International Energy Agency (IEA)
          have both recently lowered their 2026 global oil demand growth forecasts.
          The IEA now projects a decline in global oil demand of 1.6 million bpd for
          2026, citing the ongoing closure of the Strait of Hormuz and elevated fuel
          prices.


          ### U.S. Strategic Petroleum Reserve (SPR)

          The U.S. Strategic Petroleum Reserve has been utilized to mitigate supply
          disruptions linked to the conflict in the Middle East. This level is the
          lowest in over 40 years, raising concerns regarding operational capacity
          and the ability to respond to future energy emergencies.


          ### Refinery Responses

          *   **Utilization:** U.S. refinery utilization rates have remained high.

          *   **Global Context:** While refinery crude throughputs increased in July,
          they remained nearly 5 million bpd below year-earlier levels. Regional disruptions,
          particularly in the Middle East and attacks on Russian refineries, have
          continued to impact global runs.'
