        cleaned_summary: "Crude oil prices in July 2026 were primarily driven by the\
          \ ongoing geopolitical conflict in the Middle East, specifically regarding\
          \ the status of the Strait of Hormuz, alongside shifting expectations for\
          \ global supply and demand.\n\nKey factors affecting crude oil prices during\
          \ this period included:\n\n*   **Geopolitical Volatility and the Strait\
          \ of Hormuz:** The conflict between the U.S.-Israel coalition and Iran remained\
          \ the central driver of market sentiment. Early in July, prices experienced\
          \ a downward correction following a fragile U.S.-Iran memorandum of understanding\
          \ (MOU) that eased immediate supply fears and allowed for a partial resumption\
          \ of trade through the Strait of Hormuz. However, by mid-July, renewed hostilities\
          \ and attacks on vessels in the region revived fears of supply disruptions,\
          \ leading to a rebound in prices.\n*   **Supply and Inventory Dynamics:**\
          \ Global oil supply remained significantly below pre-conflict levels. While\
          \ June saw a partial recovery in Gulf production, July witnessed renewed\
          \ disruptions that undermined these efforts. Global observed oil inventories,\
          \ which had risen in June, saw a sharp decline in July as export disruptions\
          \ reduced the volume of oil on water.\n*   **Demand Trends:** Global oil\
          \ demand showed signs of a recovery from its May nadir, supported by seasonal\
          \ trends and the release of pent-up demand. However, this was partially\
          \ offset by \"demand destruction\" and weak consumption in key markets like\
          \ China, which provided a cushion against more severe price spikes.\n* \
          \  **Macroeconomic Factors:** Expectations regarding U.S. Federal Reserve\
          \ interest rate policy influenced the market; a shift toward an easing posture\
          \ heading into July weakened the U.S. dollar, which acted as a tailwind\
          \ for commodity prices and supported a late-month rally.\n*   **Market Buffers:**\
          \ Throughout the month, the market continued to rely on mitigating measures\u2014\
          such as the use of strategic reserves, alternative export routes, and reshuffled\
          \ trade flows\u2014to prevent a more severe supply shortage, even as these\
          \ buffers faced depletion."
