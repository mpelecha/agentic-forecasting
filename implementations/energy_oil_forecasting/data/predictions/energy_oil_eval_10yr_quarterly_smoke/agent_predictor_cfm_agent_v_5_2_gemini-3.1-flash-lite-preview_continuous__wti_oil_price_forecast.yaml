        cleaned_summary: "As of August 2026, global crude oil markets are characterized\
          \ by significant supply constraints and volatility driven primarily by the\
          \ ongoing closure of the Strait of Hormuz.\n\n### Global Crude Oil Production\
          \ Trends\n*   **Supply Contraction:** Global oil supply remains significantly\
          \ below year-ago levels due to the disruption of transit through the Strait\
          \ of Hormuz. As of July 2026, approximately 8.3 million barrels per day\
          \ (mb/d) of Gulf production remained shut in.\n*   **Recent Performance:**\
          \ While global oil supply rose by 2.4 mb/d in July 2026 to reach 101.5 mb/d,\
          \ this recovery was undermined by renewed hostilities and maritime disruptions\
          \ in late July and early August.\n*   **2026 Outlook:** The International\
          \ Energy Agency (IEA) projects that global oil supply will decline by an\
          \ average of 4.3 mb/d in 2026. Forecasts for the third quarter of 2026 were\
          \ revised downward by 1.7 mb/d compared to previous estimates due to the\
          \ persistent geopolitical instability.\n\n### Global Inventory Trends\n\
          *   **Inventory Draws:** Global observed oil inventories experienced a sharp\
          \ decline in July 2026, plunging by 69 million barrels. This was largely\
          \ attributed to lower volumes of oil on water resulting from export disruptions\
          \ in the Gulf and the Caspian Sea.\n*   **Onshore Stocks:** Onshore crude\
          \ oil inventories saw a more modest decline of 6 million barrels, influenced\
          \ by a slowdown in emergency inventory releases and continued drawdowns\
          \ in Chinese stocks.\n*   **U.S. Specifics:** Despite the global trend of\
          \ inventory depletion, the U.S. Energy Information Administration (EIA)\
          \ expects U.S. commercial inventories to remain below the five-year (2021\u2013\
          2025) low through the end of 2026.\n*   **Long-term Outlook:** Current projections\
          \ suggest that a potential supply surplus could emerge in 2027 if transit\
          \ through the Strait of Hormuz normalizes, which would allow countries to\
          \ begin replenishing their strategic and commercial stocks."
