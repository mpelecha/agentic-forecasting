          were heavily influenced by the ongoing standoff between the United States
          and Iran. Reports of maritime disruptions, vessel strikes, and conflicting
          diplomatic signals regarding the status of the Strait of Hormuz created
          significant volatility.

          *   **Supply Constraints:** Market participants closely monitored tanker
