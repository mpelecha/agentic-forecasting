      \ cause a partial return of the risk premium, preventing a full decline in prices.\n\
      \n3. **Full Regional Escalation (15% probability, tail risk target >$100):**\
      \ A low-probability but high-impact scenario where the MOU collapses and major\
      \ military conflict ensues, completely blocking the strait again. \n\nMy forecast\
      \ intervals are explicitly widened at longer horizons to encompass the considerable\
      \ spread between these scenarios. Key assumptions include: OPEC+ output increases\
      \ remain largely symbolic until logistics improve, and the U.S. continues to\
      \ manage its depleted SPR carefully."
    horizon_rationale: Short-term horizon reflects the immediate market consolidation
      following the announcement of the U.S.-Iran MOU. Prices are stabilizing as traders
      wait for confirmation of safe passage through the Strait of Hormuz.
